name: Build UTM firmware

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/firmware.yml"
      - "firmware/**"
      - "tools/build_uefi_firmware.sh"
      - "tools/make_uefi_ca_bundle.py"

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: EDK2 HTTP/TLS firmware
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install EDK2 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            acpica-tools build-essential gcc-aarch64-linux-gnu nasm uuid-dev

      - name: Build pinned firmware
        run: tools/build_uefi_firmware.sh build/TinyArmOS-QEMU_EFI.fd

      - name: Verify firmware outputs
        run: |
          test "$(stat -c '%s' build/TinyArmOS-QEMU_EFI.fd)" -eq 67108864
          test "$(stat -c '%s' build/TinyArmOS-QEMU_EFI-vars.fd)" -eq 67108864
          test -s build/TinyArmOS-QEMU_EFI-ca-certs.esl
          test "$(stat -c '%s' build/TinyArmOS-QEMU_EFI-ca-certs.esl)" -eq 2138
          sha256sum build/TinyArmOS-QEMU_EFI.fd build/TinyArmOS-QEMU_EFI-vars.fd build/TinyArmOS-QEMU_EFI-ca-certs.esl

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyArmOS-UTM-firmware
          path: |
            build/TinyArmOS-QEMU_EFI.fd
            build/TinyArmOS-QEMU_EFI-vars.fd
            build/TinyArmOS-QEMU_EFI-ca-certs.esl
          if-no-files-found: error
          retention-days: 7
