name: Build firmware

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/firmware.yml"
      - "firmware/**"
      - "tools/build_uefi_firmware.sh"
      - "tools/make_uefi_ca_bundle.py"
      - "tools/build_bios.sh"
      - "tools/make_bios_rom.py"
      - "tools/test_bios.py"
      - "tests/*bios*"

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-bios:
    name: Standalone TinyGPT BIOS (no EDK II)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install standalone build and emulator tools
        run: |
          python3 -m pip install ziglang==0.14.1
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-arm
      - name: Native parser tests
        run: python3 -m unittest discover -s tests -p 'test_bios_native.py' -v
      - name: Boot without EDK II or an OS disk
        run: make bios-test
      - uses: actions/upload-artifact@v4
        with:
          name: TinyGPT-BIOS-experimental
          path: |
            build/bios/TinyGPT-BIOS.bin
            build/bios/TinyGPT-BIOS.elf
          if-no-files-found: error
          retention-days: 7

  firmware:
    name: EDK2 HTTP/TLS firmware
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install EDK2 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            acpica-tools build-essential gcc-aarch64-linux-gnu nasm uuid-dev

      - name: Build pinned firmware
        run: tools/build_uefi_firmware.sh build/TinyGPT-QEMU_EFI.fd

      - name: Verify firmware outputs
        run: |
          test "$(stat -c '%s' build/TinyGPT-QEMU_EFI.fd)" -eq 67108864
          test "$(stat -c '%s' build/TinyGPT-QEMU_EFI-vars.fd)" -eq 67108864
          test -s build/TinyGPT-QEMU_EFI-ca-certs.esl
          test "$(stat -c '%s' build/TinyGPT-QEMU_EFI-ca-certs.esl)" -eq 3688
          sha256sum build/TinyGPT-QEMU_EFI.fd build/TinyGPT-QEMU_EFI-vars.fd build/TinyGPT-QEMU_EFI-ca-certs.esl

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyGPT-UEFI-firmware
          path: |
            build/TinyGPT-QEMU_EFI.fd
            build/TinyGPT-QEMU_EFI-vars.fd
            build/TinyGPT-QEMU_EFI-ca-certs.esl
          if-no-files-found: error
          retention-days: 7
