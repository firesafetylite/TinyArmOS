name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned Zig toolchain
        run: |
          python -m pip install --disable-pip-version-check ziglang==0.14.1
          python -m ziglang version

      - name: Install EDK2 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            acpica-tools build-essential gcc-aarch64-linux-gnu nasm uuid-dev

      - name: Build pinned HTTP/TLS firmware
        run: tools/build_uefi_firmware.sh build/TinyArmOS-QEMU_EFI.fd

      - name: Test host update command
        run: |
          python -m unittest discover -s tests -v
          python tinyarmos --help

      - name: Rebuild from source
        env:
          TINYARMOS_REQUIRE_UEFI_FIRMWARE: "1"
        run: make

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/BOOTAA64.EFI
          test "$(stat -c '%s' build/TinyArmOS-UTM.img)" -eq 67108864
          test -f build/TinyArmOS.utm/config.plist
          test -f build/TinyArmOS.utm/Images/disk-0.img
          test -f build/TinyArmOS.utm/Images/tinyarmos-uefi-code.fd
          test -f build/TinyArmOS.utm/Images/tinyarmos-uefi-vars.fd
          cmp build/TinyArmOS-UTM.img build/TinyArmOS.utm/Images/disk-0.img
          cmp build/TinyArmOS-QEMU_EFI.fd build/TinyArmOS.utm/Images/tinyarmos-uefi-code.fd
          cmp build/TinyArmOS-QEMU_EFI-vars.fd build/TinyArmOS.utm/Images/tinyarmos-uefi-vars.fd
          file build/BOOTAA64.EFI | grep -Eq 'PE32\+ executable.*Aarch64'
          strings build/BOOTAA64.EFI | grep -Fq 'update [check]'
          strings build/BOOTAA64.EFI | grep -Fq 'Checking GitHub Releases over firmware HTTPS'
          strings build/BOOTAA64.EFI | grep -Fq 'UTM Shared Network fallback configured; continuing automatically.'
          strings build/BOOTAA64.EFI | grep -Fq 'Network fallback is still initializing; retrying automatically...'
          strings build/BOOTAA64.EFI | grep -Fq '=== TinyArmOS Settings ==='
          strings build/BOOTAA64.EFI | grep -Fq 'settings             open the full-screen persistent settings UI'
          python - <<'PY'
          import os
          import plistlib
          import runpy
          from pathlib import Path

          updater = runpy.run_path("tinyarmos", run_name="release_validation")
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag.startswith("v")
          updater["validate_efi"](Path("build/BOOTAA64.EFI").read_bytes(), tag[1:])
          image = Path("build/TinyArmOS-UTM.img").read_bytes()
          assert image[512:520] == b"EFI PART"
          assert image[2048 * 512 + 82:2048 * 512 + 90] == b"FAT32   "
          with Path("build/TinyArmOS.utm/config.plist").open("rb") as stream:
              config = plistlib.load(stream)
          assert config["System"]["Architecture"] == "aarch64"
          assert config["System"]["BootUefi"] is True
          assert config["System"]["Memory"] >= 256
          assert [drive["ImagePath"] for drive in config["Drives"]] == [
              "tinyarmos-uefi-code.fd",
              "tinyarmos-uefi-vars.fd",
              "disk-0.img",
          ]
          assert [drive["InterfaceType"] for drive in config["Drives"]] == [
              "pflash", "pflash", "virtio"
          ]
          assert config["Networking"]["NetworkEnabled"] is True
          assert config["Networking"]["NetworkCard"] == "virtio-net-pci"
          PY

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          efi_name="TinyArmOS-${tag}-BOOTAA64.EFI"
          mkdir -p dist
          cp build/BOOTAA64.EFI "dist/${efi_name}"
          cp build/TinyArmOS-UTM.img "dist/TinyArmOS-${tag}-UTM.img"
          cp -R build/TinyArmOS.utm "dist/TinyArmOS-${tag}.utm"
          cp tinyarmos dist/tinyarmos
          chmod +x dist/tinyarmos
          mkdir -p "dist/TinyArmOS-${tag}.utm/Licenses"
          cp LICENSE "dist/TinyArmOS-${tag}.utm/Licenses/TinyArmOS-GPL-2.0-only.txt"
          cp THIRD_PARTY_NOTICES.md "dist/TinyArmOS-${tag}.utm/Licenses/"
          cp firmware/licenses/*.txt "dist/TinyArmOS-${tag}.utm/Licenses/"
          cp third_party/PureDOOM/LICENSE \
            "dist/TinyArmOS-${tag}.utm/Licenses/PureDOOM-GPL-2.0.txt"
          cp assets/FREEDOOM-COPYING.txt \
            assets/FREEDOOM-CREDITS.txt \
            assets/FREEDOOM-CREDITS-MUSIC.txt \
            assets/FREEDOOM-README.html \
            "dist/TinyArmOS-${tag}.utm/Licenses/"
          (
            cd dist
            zip -9 -r "TinyArmOS-${tag}-UTM.utm.zip" "TinyArmOS-${tag}.utm" tinyarmos
            rm -rf "TinyArmOS-${tag}.utm"
          )
          zip -9 "dist/TinyArmOS-${tag}-LICENSES.zip" \
            LICENSE THIRD_PARTY_NOTICES.md \
            firmware/licenses/EDK2-LICENSE.txt \
            firmware/licenses/LIBFDT-LICENSE.txt \
            firmware/licenses/OPENSSL-LICENSE.txt \
            third_party/PureDOOM/LICENSE \
            assets/FREEDOOM-COPYING.txt \
            assets/FREEDOOM-CREDITS.txt \
            assets/FREEDOOM-CREDITS-MUSIC.txt \
            assets/FREEDOOM-README.html
          efi_size="$(stat -c '%s' "dist/${efi_name}")"
          efi_sha256="$(sha256sum "dist/${efi_name}" | cut -d ' ' -f 1)"
          cat > dist/TinyArmOS-update.txt <<EOF
          version=${version}
          size=${efi_size}
          sha256=${efi_sha256}
          url=https://firesafetylite.github.io/TinyArmOS/TinyArmOS-latest-BOOTAA64.EFI
          EOF
          (
            cd dist
            test "$(grep -c '^' TinyArmOS-update.txt)" -eq 4
            test "$(awk -F= '/^size=/{print $2}' TinyArmOS-update.txt)" -eq "$(stat -c '%s' "${efi_name}")"
            test "$(awk -F= '/^sha256=/{print $2}' TinyArmOS-update.txt)" = "$(sha256sum "${efi_name}" | cut -d ' ' -f 1)"
            sha256sum TinyArmOS-* tinyarmos > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --verify-tag \
              --title "TinyArmOS ${tag}" \
              --generate-notes
          fi
