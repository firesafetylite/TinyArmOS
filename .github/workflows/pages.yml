name: Publish update channel

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (defaults to latest)
        required: false
        type: string
  repository_dispatch:
    types:
      - release-published
      - nightly-published

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out channel publisher
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Download and verify main and nightly assets
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ -z "$tag" ]]; then
            tag="$latest_tag"
          elif [[ "$tag" != "$latest_tag" ]]; then
            echo "Refusing to publish non-latest main release $tag (latest is $latest_tag)." >&2
            exit 1
          fi
          mkdir -p release-main release-nightly
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'TinyGPT-update.txt' \
            --pattern 'TinyGPT-v*-BOOTAA64.EFI' \
            --dir release-main
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download nightly --repo "$GITHUB_REPOSITORY" \
              --pattern 'TinyGPT-nightly-update.txt' \
              --pattern 'TinyGPT-nightly-BOOTAA64.EFI' \
              --dir release-nightly
          fi
          python3 tools/make_update_site.py \
            --main release-main --nightly release-nightly --output public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload update channel
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy update channel
        id: deployment
        uses: actions/deploy-pages@v4
