name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64 disk image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned Zig toolchain
        run: |
          python -m pip install --disable-pip-version-check ziglang==0.14.1
          python -m ziglang version

      - name: Test host update command
        run: |
          python -m unittest discover -s tests -v
          python tinyarmos --help

      - name: Build
        run: make

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/BOOTAA64.EFI
          test "$(stat -c '%s' build/TinyArmOS.img)" -eq 134217728
          test ! -e build/TinyArmOS.utm
          test ! -e build/TinyArmOS-UTM.img
          file build/BOOTAA64.EFI | grep -Eq 'PE32\+ executable.*Aarch64'
          strings build/BOOTAA64.EFI | grep -Fq 'update [check] [main|nightly]'
          strings build/BOOTAA64.EFI | grep -Fq 'Checking the '
          strings build/BOOTAA64.EFI | grep -Fq 'nightly/TinyArmOS-update.txt'
          strings build/BOOTAA64.EFI | grep -Fq 'UTM Shared Network fallback configured; continuing automatically.'
          strings build/BOOTAA64.EFI | grep -Fq 'Network fallback is still initializing; retrying automatically...'
          strings build/BOOTAA64.EFI | grep -Fq '=== TinyArmOS Settings ==='
          strings build/BOOTAA64.EFI | grep -Fq 'settings             open the full-screen persistent settings UI'
          strings build/BOOTAA64.EFI | grep -Fq 'rm -rf /: destroying TinyArmOS now'
          strings build/BOOTAA64.EFI | grep -Fq 'The pre-OS environment remains and will open at the next boot.'
          strings build/BOOTAA64.EFI | grep -Fq '=== TinyArmOS Pre-OS Environment ==='
          strings build/BOOTAA64.EFI | grep -Fq 'Up/Down select, Enter boot, S save default, R recovery'
          strings build/BOOTAA64.EFI | grep -Fq 'partition add MIB NAME'
          strings build/BOOTAA64.EFI | grep -Fq 'repair N         repair or install TinyArmOS'
          ! strings build/BOOTAA64.EFI | grep -Fq 'bootmgr              open'
          ! strings build/BOOTAA64.EFI | grep -Fq 'Recovery Agent'
          ! strings build/BOOTAA64.EFI | grep -Fq 'command: recovery'
          strings build/BOOTAA64.EFI | grep -Fq 'scan: file integrity and checksums'
          strings build/BOOTAA64.EFI | grep -Fq 'scan: active file integrity verified'
          strings build/BOOTAA64.EFI | grep -Fq 'The running shell remains TinyArmOS'
          python - <<'PY'
          import runpy
          from pathlib import Path

          updater = runpy.run_path("tinyarmos", run_name="ci_validation")
          image = Path("build/TinyArmOS.img").read_bytes()
          assert image[512:520] == b"EFI PART"
          recovery = updater["Fat32Image"](image, 0)
          system = updater["Fat32Image"](image, 1)
          assert recovery.fat_bits == 16
          assert system.fat_bits == 32
          efi = recovery.read_file(updater["BOOT_PATH"])
          updater["validate_efi"](efi)
          assert updater["embedded_channel"](efi) == "main"
          assert system.read_file((b"TINYOS  NEW",)) == b"Initialize TinyArmOS on first boot\n"
          assert system.read_file((b"DOOMU   WAD",)).startswith(b"IWAD")
          PY
