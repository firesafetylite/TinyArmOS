name: Feature request
description: Suggest a focused improvement to TinyArmOS.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or use case
      description: What limitation or user need would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful solution and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and validation
      description: Note expected firmware, image-format, filesystem, or resource impact and how the change could be tested.
