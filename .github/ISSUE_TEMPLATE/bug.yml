name: Bug report
description: Report a reproducible TinyArmOS problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. For security issues, use the private reporting link instead.
  - type: input
    id: version
    attributes:
      label: TinyArmOS version
      description: Release tag or source revision.
      placeholder: v0.1.3
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - UTM on Apple silicon
        - Other UEFI firmware or virtual machine
        - Build only
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Boot ...\n2. Run ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add relevant build output, firmware messages, or screenshots. Remove sensitive information.
